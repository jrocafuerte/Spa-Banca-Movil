# Pipeline DevSecOps de la app móvil (OWASP MASVS):
# calidad → SAST (Semgrep, CodeQL, mobsfscan) → SCA/secretos → contrato del puente.
# El análisis del binario (MobSF sobre APK/IPA) corre en mobile-binary-scan.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (format, lint, types, tests, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run lint
      - name: Design tokens generados al día
        run: npm run tokens && git diff --exit-code -- src/shared/ui/tokens.generated.ts
      - run: npm run typecheck
      - run: npx jest --coverage --coverageReporters=lcov --coverageReporters=text-summary
      - name: Bundle JS de producción (Android) sin errores
        run: npx expo export --platform android --output-dir dist
        env: { APP_ENV: production }
      - name: El bundle no contiene secretos ni URLs de desarrollo
        run: |
          ! grep -rE "10\.0\.2\.2|localhost:300|BEGIN (EC|RSA) PRIVATE KEY" dist/
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info, retention-days: 7 }

  bridge-contract:
    name: Contratos (puente WebView + design tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c contracts/bridge-protocol.sha256
      - name: Design tokens idénticos en spa-banca-movil y spa-recaudos
        run: sha256sum -c contracts/design-tokens.sha256

  sonar:
    name: SonarQube (quality gate)
    needs: quality
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: coverage }
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten --config p/react --config p/typescript
          --config p/secrets --config .semgrep/rules.yml
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  sast-mobsfscan:
    name: SAST móvil (mobsfscan - reglas MASVS)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mobsfscan
      - run: mobsfscan --config .mobsf src/ app.config.ts --sarif --output mobsfscan.sarif || true
      - run: mobsfscan --config .mobsf --exit-warning src/ app.config.ts
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: mobsfscan.sarif, category: mobsfscan }

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  sca:
    name: SCA (dependencias + SBOM)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
